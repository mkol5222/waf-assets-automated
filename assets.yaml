
config:
  profile: "saas-ireland"
  region: "eu-west-1"

assets:
  - name: "west.example.com" # asset name
    domain: "west.example.com" # front end url without https:// prefix
    host: "httpbin.org" # host header sent to upstream
    upstream: "https://httpbin.org"
    cert_pem: "server.crt" # certificate file location
    cert_key: "server.key" # key file location


