
config:
  profile: "saas-ireland"
  region: "eu-west-1"

assets:
  - name: "west2.wafaas.klaud.online" # asset name
    domain: "west2.wafaas.klaud.online" # front end url without https:// prefix
    host: "httpbin.org" # host header sent to upstream
    upstream: "https://httpbin.org"
    cert_pem: "_.wafaas.klaud.online.crt" # certificate file location
    cert_key: "_.wafaas.klaud.online.key" # key file location


